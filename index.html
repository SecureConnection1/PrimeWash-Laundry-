function card(o){var nx=ST[ST.indexOf(o.st)+1];return'<div class="oc"><b style="cursor:pointer" onclick="openOrd('+o.id+')">#'+o.no+' \u00b7 '+esc(cust(o.cid).name)+'</b><p>'+esc(o.items.map(function(i){return i.q+"\u00d7 "+i.s.split(" (")[0]}).join(", ")).slice(0,48)+'</p><p>Due '+(o.due||"\u2013")+(late(o)?' <span class="tag late">late</span>':"")+' \u00b7 <span class="mny '+(bal(o)>0?"er":"ok")+'">'+(bal(o)>0?m(bal(o))+" owed":"paid")+'</span></p><div class="row" style="margin-top:6px">'+(nx?'<button class="s p" onclick="adv('+o.id+')">'+ACT[o.st]+'</button>':"")+(o.st=="Completed"?notifyBtns(o):"")+(bal(o)>0?'<button class="s" onclick="mpay(this,'+o.id+')">Mark paid</button>':"")+(o.del?delBtn(o):"")+'</div></div>'}
function phone(p){p=String(p).replace(/\D/g,"");return p.charAt(0)=="0"?"233"+p.slice(1):p}
function msg(o){var c=cust(o.cid);return (ME.role=="admin"?D.cfg.tpl:D.cfg.tpl.replace(/\s*Balance due: \{bal\}\.?/,"")).replace("{name}",c.name).replace("{no}",o.no).replace("{shop}",D.cfg.shop).replace("{bal}",m(bal(o)))}
function notifyBtns(o){var n=phone(cust(o.cid).phone),t=encodeURIComponent(msg(o));
 return'<a href="https://wa.me/'+n+'?text='+t+'" target="_blank" rel="noopener"><button class="s w" onclick="mark('+o.id+')">WhatsApp</button></a> <a href="sms:'+n+'?body='+t+'"><button class="s" onclick="mark('+o.id+')">SMS</button></a>'+(o.notified?' <span class="ok">\u2713</span>':"")}
function mark(id){var o=D.orders.find(function(x){return x.id==id});o.notified=new Date().toISOString();save();setTimeout(render,400)}
function newOrd(){
 $("main").innerHTML='<div class="hd"><h2>New order</h2><button onclick="go(\'orders\')">← Back to orders</button></div><div class="two"><div><div class="card"><h3>Customer</h3><div class="f"><div><label>Name</label><input id="cn" list="cl" placeholder="Type to find regulars\u2026" oninput="pick()" autofocus></div><div><label>Phone (WhatsApp)</label><input id="cp" placeholder="024 000 0000"></div><div><label>Due date</label><input id="dd" type="date" value="'+new Date(Date.now()+2*864e5).toISOString().slice(0,10)+'"></div></div><datalist id="cl">'+D.customers.map(function(c){return'<option value="'+esc(c.name)+'">'}).join("")+'</datalist></div>'+
 '<div class="card"><h3>Tap a service to add it</h3><div class="tiles">'+D.cfg.svc.map(function(s,i){return'<button onclick="addIt('+i+')">'+esc(s.n)+'<small>'+m(s.p)+'</small></button>'}).join("")+'</div><div id="dl"></div></div></div>'+
 '<div class="card"><h3 class="mny ph">Payment</h3><div id="sm"></div><div class="f" style="margin-top:10px"><div class="mny"><label>Discount</label><input id="ds" type="number" min="0" value="0" oninput="drawDraft()"></div><div class="dep"><label>Deposit (paid now)</label><input id="pn" type="number" min="0" value="0"></div><div class="mny pm"><label>Paid by</label><select id="pm"><option>Cash</option><option>MoMo</option><option>Bank</option></select></div><div><label>Note</label><input id="nt" placeholder="Stains, special care\u2026"></div></div><div class="row" style="margin-top:12px"><button onclick="$(\'pn\').value=tot();" class="mny pf">Paid in full</button><button class="p" onclick="saveOrd(0)">Save</button><button class="mny rcb" onclick="saveOrd(1)">Save & print</button></div></div></div>';drawDraft();
}
function pick(){var c=D.customers.find(function(c){return c.name==$("cn").value});if(c)$("cp").value=c.phone}
function tot(){return Math.max(0,draft.reduce(function(a,i){return a+i.q*i.p},0)-(+($("ds")||{}).value||0))}
function addIt(i){var s=D.cfg.svc[i],x=draft.find(function(d){return d.s==s.n});if(x)x.q++;else draft.push({s:s.n,q:1,p:s.p});drawDraft()}
function drawDraft(){$("dl").innerHTML=draft.length?'<table>'+draft.map(function(i,k){return'<tr><td>'+esc(i.s)+'</td><td><input type="number" step="0.1" min="0" value="'+i.q+'" style="width:80px" onchange="draft['+k+'].q=+this.value;drawDraft()"></td><td>'+m(i.q*i.p)+'</td><td><button class="s" onclick="draft.splice('+k+',1);drawDraft()">\u2715</button></td></tr>'}).join("")+'</table>':'<p class="mu">Nothing added yet.</p>';$("sm").innerHTML='<div class="row" style="justify-content:space-between"><span class="mu">Total</span><b style="font-size:24px">'+m(tot())+'</b></div>'}
function saveOrd(pr){
 var n=$("cn").value.trim(),p=$("cp").value.trim();if(!n||!p||!draft.length){alert("Add a customer name, phone and at least one item.");return}
 var c=D.customers.find(function(c){return c.name==n&&c.phone==p});if(!c){c={id:Date.now(),name:n,phone:p};D.customers.push(c)}
 var o={id:Date.now(),no:D.seq++,cid:c.id,items:draft,disc:+$("ds").value||0,pays:[],st:"Queued",date:new Date().toISOString(),due:$("dd").value,note:$("nt").value,by:ME.name,del:delOf()},a=+$("pn").value;
 if(a>0)o.pays.push({a:a,d:day(),m:$("pm").value});D.orders.unshift(o);draft=[];save();go("orders");if(pr)receipt(o.id)}
function receipt(id){var o=D.orders.find(function(x){return x.id==id}),c=cust(o.cid);
 $("rc").innerHTML='<b>'+esc(D.cfg.shop)+'</b><br>'+INFO.ad+'<br>Tel: '+INFO.ph+'<br>Order #'+o.no+' \u00b7 '+day(o.date)+'<br>'+esc(c.name)+' \u00b7 '+esc(c.phone)+'<hr>'+o.items.map(function(i){return esc(i.s)+'<br>&nbsp;&nbsp;'+i.q+' x '+m(i.p)+' = '+m(i.q*i.p)}).join("<br>")+'<hr>'+(o.disc?'Discount: -'+m(o.disc)+'<br>':'')+'Total: '+m(ordTotal(o))+'<br>Paid: '+m(paid(o))+'<br><b>Balance: '+m(bal(o))+'</b><br>Pickup: '+(o.due||"\u2013")+'<hr>Thank you! '+INFO.tag+'<br>Free pickup &amp; delivery';setTimeout(function(){window.print()},100)}

 $("main").innerHTML='<div class="hd"><h2>Orders</h2><button class="p" onclick="go(\'new\')">+ New order <kbd>N</kbd></button></div><div class="card"><div class="row" style="margin-bottom:10px"><select id="fs" onchange="orders2()" style="width:auto"><option value="">All statuses</option><option value="late">Overdue</option><option value="owing" class="mny">Unpaid</option>'+ST.map(function(s){return'<option>'+s+'</option>'}).join("")+'</select><input id="fq" value="'+esc(Q)+'" oninput="Q=this.value;orders2()" placeholder="Search name / order #" style="max-width:260px"></div><div class="tw" id="ot"></div></div>';orders2()}
